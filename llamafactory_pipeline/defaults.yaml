# 官方参考: examples/train_lora/qwen3_lora_sft.yaml
# 本文件仅作参数默认值对照; 实际默认值以 schema.py 为准 (前端表单由其生成)。

### model
model_name_or_path: /data/wangzhengyan/Qwen3.5-9B/
trust_remote_code: true
flash_attn: auto
quantization_bit: null
quantization_method: bitsandbytes
double_quantization: true
disable_gradient_checkpointing: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: null
lora_dropout: 0.0
lora_target: all
pref_beta: null
pref_loss: null
include_effective_tokens_per_second: false

### dataset
dataset: identity,alpaca_en_demo   # 运行时由上传数据集名覆盖
template: qwen3_5_nothink
cutoff_len: 2048
max_samples: 1000
preprocessing_num_workers: 16
dataloader_num_workers: 4
packing: null
tool_format: null

### output
output_dir: saves/qwen3-4b/lora/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
max_grad_norm: 1.0
seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval (默认关闭)
